name: Test

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Go modules
        # dependencies are vendored; tidy/verify would try to fetch private
        # modules (git.toimc.com) which CI cannot reach — a vendor-mode build
        # keeps the "what was committed compiles" gate with zero network.
        # bare `go vet` is avoided: stdmethods flags long-standing
        # ReadFrom/WriteTo signatures that golangci-lint config exempts
        run: go build ./...

      - name: Test
        run: make test
